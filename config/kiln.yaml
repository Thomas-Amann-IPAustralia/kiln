# Kiln's environment: the outside services it depends on, and the build phase that first
# needs each one. Validated by src/kiln/config.py; an unknown key is an error.
#
# Only key NAMES live here. Values come from the environment or .env (see .env.example).
# Where a cloud session's proxy injects a key, the variable can stay unset: `kiln doctor`
# sends a placeholder and the proxy replaces it.
#
# `needed_from_phase` follows docs/charter/build-plan.md. `kiln doctor` exits 2 when a service
# needed at or before `current_phase` does not answer.

current_phase: 0
probe_timeout_seconds: 20

services:
  langfuse:
    purpose: Tracing and evaluation for every agent (EU cloud region).
    needed_from_phase: 0
    probe:
      base_url: https://cloud.langfuse.com
      path: /api/public/projects
      auth: {scheme: basic, env_user: LANGFUSE_PUBLIC_KEY, env_password: LANGFUSE_SECRET_KEY}

  neon:
    purpose: Postgres for the catalogue, workflow state, findings, project metadata and evidence.
    needed_from_phase: 0
    env: [NEON_DATABASE_URL]

  r2:
    purpose: Object storage for raw source snapshots and evidence artefacts, by hash.
    needed_from_phase: 0
    env: [R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET]

  modal:
    purpose: Disposable sandboxes for generated or untrusted code, with a spend cap per run.
    needed_from_phase: 0
    env: [MODAL_TOKEN_ID, MODAL_TOKEN_SECRET]

  openai:
    purpose: Model provider.
    needed_from_phase: 1
    probe:
      base_url: https://api.openai.com
      path: /v1/models
      auth: {scheme: bearer, env: OPENAI_API_KEY}

  gemini:
    purpose: Model provider, and the second family for judging OpenAI output.
    needed_from_phase: 1
    probe:
      base_url: https://generativelanguage.googleapis.com
      path: /v1beta/models?pageSize=1
      auth: {scheme: header, header: x-goog-api-key, env: GEMINI_API_KEY}

  anthropic:
    purpose: Model provider for the coding swarm and for sophisticated agentic work.
    needed_from_phase: 1
    probe:
      base_url: https://api.anthropic.com
      path: /v1/models?limit=1
      auth: {scheme: header, header: x-api-key, env: ANTHROPIC_API_KEY}
      extra_headers: {anthropic-version: "2023-06-01"}

  brave:
    purpose: Web search for discovery only; a search result is never evidence.
    needed_from_phase: 1
    env: [BRAVE_API_KEY]

# Models Kiln may call. Prices are copied by hand from the provider's own page, with the date,
# because no provider serves them through its API. A paid command refuses a request that would
# go past `prices_valid_up_to_input_tokens`, where the provider charges a higher rate.
models:
  openai-reviewer:
    service: openai
    model: gpt-6.1-sol
    effort: high
    max_output_tokens: 32000
    request_timeout_seconds: 900
    usd_per_million_tokens:
      input: 2.00
      cached_input: 0.10
      cache_write: 2.50       # the default 30-minute cache
      cache_write_long: 5.00  # the 12-hour cache
      output: 10.00
    prices_valid_up_to_input_tokens: 272000
    prices_checked: >-
      2026-11-17, developers.openai.com/api/docs/pricing (standard tier, context up to 272K
      tokens), developers.openai.com/api/docs/models/gpt-6.1-sol (effort values low,
      medium, high, xhigh, max) and developers.openai.com/api/docs/guides/prompt-caching
      (caching is on by default; a cache write is billed instead of input, not on top)

# Budgets in US dollars. Only Tom sets one; each carries his words and the date. Code enforces
# it: a paid request starts only if the spend recorded so far plus its upper-bound estimate fits.
budgets:
  docs-second-opinion:
    usd: 2.00
    approved: >-
      Tom, 2026-11-17: "Before I agree or disagree, I permit you to spend up to $2 on OpenAI
      tokens to get a second opinion."

# The spend ledger (D-013): every paid call reserves its upper-bound cost against a budget above
# before it is sent, and settles at the real cost after. A reservation that could pass a budget
# is refused; one that takes a budget to `warn_at` of its cap warns. Sketch, "Spend".
spend:
  ledger: docs/spend/ledger.jsonl
  warn_at: 0.8

# The scanner baseline (D-013): Semgrep CE, OSV-Scanner and Trivy, feeding one finding format
# (src/kiln/findings.py). CI installs exactly these versions and `kiln scan` refuses any other;
# tests/test_repo_hygiene.py checks that the workflow and this file agree. Each scanner has a
# seeded finding that CI must see it detect, so a scanner that silently stops finding things
# fails CI instead of passing it.
scanners:
  # The charter: "critical or high findings are fixed or explained before G4". `unknown` blocks
  # too, because nothing shows it is smaller (inferred, D-013).
  blocking: [critical, high, unknown]
  # Each dismissal is one finding's key, a reason, who and when. This file is in CODEOWNERS.
  dismissals: config/dismissals.yaml
  # The only environment variables a scanner sees: enough to run and to reach the network
  # through a proxy, and no credential. Trivy's release pipeline was compromised in March 2026
  # (CVE-2026-33634) to steal exactly what a CI job's environment holds.
  environment: [PATH, HOME, TMPDIR, LANG, LC_ALL, HTTPS_PROXY, https_proxy, HTTP_PROXY,
                http_proxy, NO_PROXY, no_proxy, SSL_CERT_FILE, SSL_CERT_DIR, REQUESTS_CA_BUNDLE,
                XDG_CACHE_HOME]
  timeout_seconds: 900

  # Source weaknesses. Installed from PyPI with every package's hash checked
  # (.github/scanners/semgrep-requirements.txt). Rules from one commit of semgrep-rules, fetched
  # by CI and never copied into this repo (Semgrep Rules License v1.0 allows internal use).
  semgrep:
    version: 1.183.0            # uploaded 2026-10-29
    rules:
      repository: https://github.com/semgrep/semgrep-rules
      commit: 16b9e6d45f10649f6a531ec4838ed9924372c3bc  # 2026-10-21
      packs: [python, yaml/github-actions]
    # Test code runs only in CI, with a read-only token. Semgrep skips tests by default; its
    # rules gave four false positives on Kiln's tests in their first run (D-013).
    exclude: [tests]
    seeded:
      target: tests/seeded-findings/semgrep
      rule: python.lang.security.audit.subprocess-shell-true

  # Dependency vulnerabilities, from OSV.dev's advisories, read live: a new advisory against a
  # locked package fails CI with no change here, which is the point.
  osv_scanner:
    module: github.com/google/osv-scanner/v2
    package: github.com/google/osv-scanner/v2/cmd/osv-scanner
    version: v2.7.0             # tagged 2026-10-12
    seeded:
      target: tests/seeded-findings/osv-scanner/seeded-requirements
      parse_as: requirements.txt
      rule: CVE-2020-14343

  # Misconfiguration in Dockerfiles and infrastructure code, with the checks built into this
  # version. Its vulnerability scanning would repeat OSV-Scanner's on uv.lock, so it is off until
  # there is a container image to scan. v0.69.4 was the malicious release; v0.76.1 is seven
  # releases later, and the Go module proxy serves it (it refuses v0.69.4).
  trivy:
    module: github.com/aquasecurity/trivy
    package: github.com/aquasecurity/trivy/cmd/trivy
    version: v0.76.1            # tagged 2026-10-21
    scanners: [misconfig]
    exclude: [tests/seeded-findings]
    seeded:
      target: tests/seeded-findings/trivy
      rule: DS-0002

# The verifier (D-014): the only writer of a ticket's pass (ADR-0027). It runs a solution's checks
# and verification steps, from its council/tickets.json, each on its own clean checkout of a
# loop's commit, with only these environment variables: enough to run tools and reach package
# registries through a proxy, and no credential. The commands run a loop's code, so ADR-0007 puts
# them in a sandbox; until slice 5 brings one, `kiln verify --runner local` is for code no agent
# wrote.
verifier:
  environment: [PATH, HOME, TMPDIR, LANG, LC_ALL, HTTPS_PROXY, https_proxy, HTTP_PROXY,
                http_proxy, NO_PROXY, no_proxy, SSL_CERT_FILE, SSL_CERT_DIR, REQUESTS_CA_BUNDLE,
                XDG_CACHE_HOME]
