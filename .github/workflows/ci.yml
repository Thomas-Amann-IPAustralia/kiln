# CI is backpressure: a failing check blocks the merge. The test job needs no network beyond
# installing locked dependencies, no model downloads and no live LLM (tests/conftest.py
# refuses sockets).
#
# Security baseline (docs/charter/agents/security-architect.md): actions pinned to a full
# commit SHA, read-only token, no privileged trigger on untrusted pull requests.
# tests/test_repo_hygiene.py enforces all three.
name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  GITLEAKS_VERSION: "8.30.1"
  # From gitleaks_8.30.1_checksums.txt on the release page.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  check:
    name: lint, types, tests, records
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install uv
        run: python -m pip install --quiet "uv==${UV_VERSION}"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      - name: Tests
        run: uv run pytest
      - name: Records
        run: uv run kiln records check

  secrets:
    name: gitleaks (tripwire 2)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks, verified against its published checksum
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf gitleaks.tar.gz -C "${RUNNER_TEMP}/bin" gitleaks
          rm gitleaks.tar.gz
      - name: Scan the whole history
        run: '"${RUNNER_TEMP}/bin/gitleaks" git --redact --no-banner --exit-code 1 .'
