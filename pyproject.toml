[project]
name = "kiln"
version = "0.0.1"
description = "Kiln: an agentic software factory. The Council of expert agents, its shared core and its coding swarm."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.scripts]
kiln = "kiln.cli:app"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.11",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiln"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# The seeds are sealed. Ruff formats Python inside Markdown, so keep it out of them (D-002).
extend-exclude = ["docs/repo-seeds"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PTH", "RUF", "S", "T20", "N"]
ignore = [
    "S101", # pytest's assert is the test idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "S607"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
xfail_strict = true
